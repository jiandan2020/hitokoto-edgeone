# 持续集成：推送到 main 与拉取请求时跑全部检查。
# 用 Node 22，与定时工作流保持一致。
name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 安装 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 代码风格检查
        run: npm run lint
      - name: 后端测试
        run: npm test
      - name: 前端测试
        run: npm run test:web
      - name: 构建与部署校验
        run: npm run build
      - name: 确定性构建检查
        run: npm run check:deterministic
