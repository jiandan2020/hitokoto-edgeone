name: 采集域名每日请求数

on:
  schedule:
    - cron: '17 18 * * *' # 北京时间 02:17，采集上一完整日
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出最新采集脚本
        uses: actions/checkout@v4
        with:
          ref: main
          path: project
      - name: 检出独立统计数据分支
        uses: actions/checkout@v4
        with:
          ref: stats-data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 采集每日数据
        id: collect
        continue-on-error: true
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        working-directory: data
        run: node ../project/collect-stats.js
      - name: 提交有效数据
        working-directory: data
        run: |
          set -euo pipefail
          git add daily-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: 更新每日域名请求统计'
          for attempt in 1 2 3; do
            git fetch origin stats-data
            git rebase origin/stats-data
            if git push origin HEAD:stats-data; then exit 0; fi
          done
          echo '多次推送失败，请重新运行工作流。' >&2
          exit 1
      - name: 标记采集失败
        if: steps.collect.outcome == 'failure'
        run: exit 1
