name: 同步一言句子库

on:
  schedule:
    - cron: '17 19 * * *' # 北京时间 03:17，每天自动同步上游句子库
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出部署分支
        uses: actions/checkout@v5
        with:
          ref: main
          path: project
      - name: 检出上游句子库
        uses: actions/checkout@v5
        with:
          repository: hitokoto-osc/sentences-bundle
          ref: master
          path: upstream
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 验证、同步并生成函数
        working-directory: project
        run: |
          set -euo pipefail
          node sync-sentences.js ../upstream
          npm run generate
          npm ci
          npm run build
          npm run lint
          npm test
          node -e 'const size = require("node:fs").statSync("edge-functions/api.js").size; console.log(`Generated function: ${size} bytes`); if (size > 5_000_000) throw new Error("Function exceeds conservative 5 MB source size limit");'
          node --check edge-functions/api.js
          node --input-type=module -e 'import handler from "./edge-functions/api.js"; import { readFileSync } from "node:fs"; globalThis.fetch = async u => new Response(readFileSync(`.${new URL(u).pathname}`), {headers:{"Content-Type":"application/json"}}); const r = await handler({request: new Request("https://hitokoto.xzccs.top/api")}); if (!r.ok || typeof (await r.json()).hitokoto !== "string") throw new Error("API smoke test failed");'
      - name: 有变化时提交并推送
        id: push
        working-directory: project
        run: |
          set -euo pipefail
          git add sentences/ categories.json version.json sentence-index.json edge-functions/api.js
          if git diff --cached --quiet; then
            echo '上游数据没有变化，无需提交。'
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          upstream_sha=$(git -C ../upstream rev-parse HEAD)
          git commit -m "chore: 同步上游句子库 ${upstream_sha}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 等待新版本上线并预热 KV
        if: steps.push.outputs.pushed == 'true'
        working-directory: project
        run: |
          set -euo pipefail
          version=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("sentence-index.json", "utf8")).version)')
          echo "新句子版本：${version}"
          node scripts/warm-kv.mjs https://hitokoto.xzccs.top "$version"
